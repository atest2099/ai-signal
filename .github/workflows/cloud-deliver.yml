name: Cloud Deliver to Feishu

on:
  # 仅由外部精确调度（如 cron-job.org 于北京时间 07:55 触发 workflow_dispatch）调用，
  # 不再使用 GitHub 自带 schedule，以避免调度抖动导致迟到、并防止与定时触发器重复发送。
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install httpx

      - name: Fetch feeds, AI remix, and deliver to Feishu
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: https://ai.api.coregpu.cn/v1/chat/completions
          LLM_MODEL: deepseek-v4-flash-w8a8
        run: python scripts/cloud_deliver.py
