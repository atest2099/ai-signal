name: Cloud Deliver to Feishu

on:
  schedule:
    - cron: '0 23 * * *'  # UTC 23:00 = Beijing 07:00（提前以抵消 GitHub 调度抖动；feeds 约北京时间 06:00 生成，07:00 触发有约 1h 余量）
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install httpx

      - name: Fetch feeds, AI remix, and deliver to Feishu
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: https://ai.api.coregpu.cn/v1/chat/completions
          LLM_MODEL: deepseek-v4-flash-w8a8
        run: python scripts/cloud_deliver.py
